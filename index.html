<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Income & Expense Tracker</title>
    <meta name="description" content="Android-style income and expense tracking application with visual analytics, YoY quarter comparisons, custom categories, CSV upload, and automated budget reports." />
    <meta property="og:title" content="Income & Expense Tracker" />
    <meta property="og:description" content="Android-style income and expense tracking application with visual analytics, YoY quarter comparisons, custom categories, CSV upload, and automated budget reports." />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#4F46E5" />
    <meta name="color-scheme" content="light" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="ExpenseTracker" />
    <link rel="manifest" href="./manifest.json" />
    <link rel="icon" type="image/png" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Immediately unregister any legacy service workers
      if (typeof navigator !== 'undefined' && 'serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (var i = 0; i < regs.length; i++) regs[i].unregister();
        }).catch(function() {});
      }
      // On-screen diagnostic logger if scripts fail to load in Android WebView
      window.addEventListener('error', function(e) {
        var box = document.getElementById('debug-error-box');
        if (!box) {
          box = document.createElement('div');
          box.id = 'debug-error-box';
          box.style.cssText = 'position:fixed;bottom:16px;left:16px;right:16px;background:#fef2f2;border:1px solid #ef4444;color:#991b1b;padding:12px;border-radius:12px;font-size:12px;font-family:monospace;z-index:999999;word-break:break-all;box-shadow:0 10px 15px rgba(0,0,0,0.15);';
          document.body.appendChild(box);
        }
        box.innerHTML = '<strong>App Launch Diagnostic:</strong><br>' + (e.message || 'Script error') + (e.filename ? '<br><small>' + e.filename + ':' + e.lineno + '</small>' : '');
      });
    </script>
  </head>
  <body class="bg-[#F8FAFC] text-slate-800 antialiased selection:bg-indigo-500 selection:text-white font-['Plus_Jakarta_Sans',sans-serif]">
    <div id="root">
      <div style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;background-color:#F8FAFC;font-family:system-ui,-apple-system,sans-serif;color:#1E293B;padding:24px;text-align:center;">
        <div style="width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,#4F46E5,#7C3AED);display:flex;align-items:center;justify-content:center;color:#ffffff;font-size:24px;font-weight:800;margin-bottom:16px;box-shadow:0 10px 25px -5px rgba(79,70,229,0.4);">₹</div>
        <div style="font-size:17px;font-weight:700;color:#0F172A;margin-bottom:6px;">Expense Tracker</div>
        <div style="font-size:13px;color:#64748B;">Starting application...</div>
      </div>
    </div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
